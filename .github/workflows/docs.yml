name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.42

      - name: Render site
        shell: bash
        run: |
          set -o pipefail
          quarto render docs 2>&1 | tee render.log
          if grep -qiE 'WARN|ERROR' render.log; then
            echo "::error::quarto render reported warnings or errors"
            exit 1
          fi

      - name: Check for unresolved shortcodes
        shell: bash
        run: |
          if grep -rlE '\?meta:|\?var:|\{\{<' docs/_site --include='*.html'; then
            echo "::error::unresolved meta/var/include shortcodes in rendered pages"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
